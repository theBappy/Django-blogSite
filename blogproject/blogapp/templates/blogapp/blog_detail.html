{% extends 'blogapp/base.html' %}
{% block title %}{{ post.title }} - My Blog{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h2>{{post.title}}</h2>
        <p class="text-muted">By {{post.author}} | {{post.created_at|date:"F d, Y" }}</p>
        <hr>
        <p>{{post.content}}</p>
        <a href="{% url 'edit-post' post.id %}" class="btn btn-warning">Edit Post</a>
        <a href="{% url 'delete-post' post.id %}" class="btn btn-danger">Delete Post</a>
        <hr>
        <a href="{% url 'blog-home' %}" class="btn btn-primary mt-3">Back to Home</a>
    </div>
{% endblock %}
